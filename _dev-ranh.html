<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><title>test ranh</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html,body{margin:0}
  #map{height:760px}
  #st{font:13px sans-serif;padding:6px;background:#111;color:#0f0}
  .ranh-label{width:0!important;height:0!important;margin:0!important;background:none;border:none;pointer-events:none}
  .ranh-label > span{position:absolute;left:0;top:0;transform:translate(-50%,-50%);font-size:11px;font-weight:600;line-height:1.1;color:#4c1d95;white-space:nowrap;
    text-shadow:-1px -1px 0 #fff,1px -1px 0 #fff,-1px 1px 0 #fff,1px 1px 0 #fff,0 -1px 0 #fff,0 1px 0 #fff,-1px 0 0 #fff,1px 0 0 #fff}
</style></head><body>
<div id="st">dang tai...</div><div id="map"></div>
<script type="module">
import { createBoundaryLayer } from './js/boundaries.js';
const st = document.getElementById('st');
window.onerror = (m) => { st.textContent = 'JS ERROR: ' + m; st.style.color='#f44'; };
const zoom = Number(new URLSearchParams(location.search).get('z') || 14);
const map = L.map('map').setView([10.7707, 106.6945], zoom);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19}).addTo(map);
try {
  const b = await createBoundaryLayer(map);
  map.addLayer(b.polygons);
  const nLbl = () => document.querySelectorAll('.ranh-label').length;
  setTimeout(() => {
    st.textContent = `zoom=${map.getZoom()} | features=${b.count} | nhan tao=${b.labelCount} | nhan trong DOM=${nLbl()} | path SVG=${document.querySelectorAll('#map path').length}`;
  }, 1500);
} catch (e) { st.textContent = 'LOI: ' + e.message; st.style.color='#f44'; }
</script></body></html>
