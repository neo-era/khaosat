<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.json">
  <title>Báo cáo sự cố — SAPULICO</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* Khổ A4, Times — bám theo mẫu "BÁO CÁO SỰ CỐ công tác quản lý, bảo dưỡng hệ thống" */
    #bcsc-preview {
      background: #fff; color: #000; box-sizing: border-box;
      width: 210mm; min-height: 297mm; padding: 15mm 15mm 15mm 20mm;
      font-family: 'Times New Roman', Times, serif; font-size: 13pt; line-height: 1.4;
    }
    #bcsc-preview p { margin: 0 0 4px; }
    #bcsc-preview .ed { border-bottom: 1px dotted #888; outline: none; cursor: text; }
    #bcsc-preview .ed:empty::before { content: attr(data-ph); color: #aaa; font-style: italic; }
    #bcsc-preview .ed:focus { background: #fffde7; border-bottom-color: #1d4ed8; }
    #bcsc-preview .ed-block { display: block; min-height: 1.4em; }
    .bc-head { width: 100%; border-collapse: collapse; }
    .bc-head td { vertical-align: top; text-align: center; font-size: 12pt; }
    .bc-sign { width: 100%; border-collapse: collapse; margin-top: 10px; }
    .bc-sign td { width: 50%; vertical-align: top; text-align: center; font-weight: bold; font-size: 12pt; }
    .bc-sign .space { height: 70px; }
    .space-lg { height: 95px; }
    /* Gạch ngắn dưới tiêu đề và dòng chấm: vẽ bằng viền ô bảng để bản Word giống hệt */
    .bc-rule { border-collapse: collapse; }
    .bc-rule td { border-bottom: 1px solid #000; padding: 0; height: 6px; font-size: 2px; line-height: 2px; }
    .bc-dots { width: 100%; border-collapse: collapse; margin: 2px 0 8px; }
    .bc-dots td { border-bottom: 1px dotted #000; padding: 0; height: 16px; }
    /* Ảnh 2 cột, 4 ảnh/trang: mỗi ảnh rộng ≤ 84 mm, cao ≤ 110 mm, giữ tỉ lệ, căn giữa ô */
    .bc-photos { width: 100%; border-collapse: collapse; margin-top: 6px; }
    .bc-photos td { width: 50%; padding: 4px; text-align: center; vertical-align: middle; }
    .bc-photos img { max-width: 84mm; max-height: 110mm; width: auto; height: auto; border: 1px solid #999; }
    .page-break { page-break-before: always; break-before: page; height: 0; }
    @media print {
      /* Lề đặt ở trang giấy (không đặt ở khung): khung chỉ có 1 lần padding nên trang 2 trở đi
         bị dính sát mép trên. Lề trên–phải–dưới 15 mm, trái 20 mm như trang 1. */
      @page { size: A4; margin: 15mm 15mm 15mm 20mm; }
      #bcsc-preview { width: auto; min-height: 0; padding: 0; }
      main { padding: 0 !important; max-width: none !important; }
      .page-break + p { margin-top: 0 !important; }
      body { background: #fff !important; }
      .no-print, #help-fab { display: none !important; }
      #doc-wrap { overflow: visible !important; box-shadow: none !important; }
      #bcsc-preview .ed { border-bottom: none; }
      #bcsc-preview .ed:empty::before { content: ''; }
      .bc-photo { page-break-inside: avoid; break-inside: avoid; }
    }
  </style>
</head>
<body class="bg-gray-100 min-h-screen">

  <header class="no-print sticky top-0 bg-white shadow-sm z-40">
    <div class="max-w-7xl mx-auto px-3 py-2 flex items-center gap-2">
      <a href="index.html" class="text-xl flex items-center justify-center rounded hover:bg-gray-100 text-gray-600"
         style="min-height:44px; min-width:44px;">←</a>
      <span class="text-sm font-bold text-blue-900 flex-1">🚨 Báo cáo sự cố</span>
      <span id="header-user" class="text-xs text-gray-500 hidden sm:block truncate max-w-[180px]"></span>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-3 py-4 pb-24">
    <div class="no-print bg-white rounded-xl shadow-sm p-4 mb-3">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
        <div>
          <label class="block text-xs text-gray-600 mb-1">Từ ngày</label>
          <input id="f-from" type="date" class="w-full px-3 py-2 border rounded-lg text-sm" style="min-height:44px">
        </div>
        <div>
          <label class="block text-xs text-gray-600 mb-1">Đến ngày</label>
          <input id="f-to" type="date" class="w-full px-3 py-2 border rounded-lg text-sm" style="min-height:44px">
        </div>
        <div class="col-span-2">
          <label class="block text-xs text-gray-600 mb-1">Tìm (tủ, tuyến, phường, hiện trạng, người phát hiện)</label>
          <input id="f-search" type="text" placeholder="🔍 Gõ để lọc..." class="w-full px-3 py-2 border rounded-lg text-sm" style="min-height:44px">
        </div>
      </div>
      <div class="flex gap-2 mt-3 items-center">
        <button id="btn-load" class="bg-blue-700 text-white px-4 py-2 rounded-lg font-medium text-sm shrink-0 whitespace-nowrap" style="min-height:44px">🔄 Tải danh sách</button>
        <span id="loading" class="hidden text-xs text-gray-500">⏳ Đang tải...</span>
        <span id="count" class="text-xs text-gray-600"></span>
      </div>
    </div>

    <div id="list" class="no-print grid grid-cols-1 md:grid-cols-2 gap-2 mb-4"></div>

    <div id="doc-area" class="hidden">
      <div class="no-print flex flex-wrap gap-2 mb-2 items-center">
        <button id="btn-print" class="bg-green-700 text-white px-4 py-2 rounded-lg font-medium text-sm" style="min-height:44px">🖨️ In / Lưu PDF</button>
        <button id="btn-word" class="bg-blue-800 text-white px-4 py-2 rounded-lg font-medium text-sm" style="min-height:44px">📝 Xuất Word</button>
        <button id="btn-close" class="bg-gray-200 text-gray-800 px-4 py-2 rounded-lg font-medium text-sm" style="min-height:44px">✕ Đóng</button>
        <span class="text-xs text-gray-500">Chữ gạch chấm sửa trực tiếp được. Dòng "Công tác" và tên người ký được nhớ cho lần sau.</span>
      </div>
      <div id="doc-wrap" class="overflow-x-auto rounded-xl shadow-md">
        <div id="bcsc-preview"></div>
      </div>
    </div>
  </main>

  <script type="module">
    import { initSwUpdate } from './js/sw-update.js';
    import { requireAuth } from './js/auth.js';
    import { initBcsc } from './js/bcsc.js';
    import { initHelp } from './js/help.js';

    // Mọi tài khoản có quyền nhập (trừ demo) lập biên bản được — user chốt 2026-09-30
    const user = requireAuth('submit');
    document.getElementById('header-user').textContent = user.full_name + ' · ' + user.role;
    initBcsc();
    initHelp('admin');

    initSwUpdate();   // đăng ký SW + tự cập nhật khi có phiên bản mới (js/sw-update.js)
  </script>
</body>
</html>
