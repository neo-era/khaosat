<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.json">
  <title>Lịch công tác — SAPULICO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="sticky top-0 bg-white shadow-sm z-40">
    <div class="max-w-6xl mx-auto px-2 py-1 flex items-center gap-2">
      <a href="index.html" class="text-xl px-2 rounded hover:bg-gray-100 flex items-center justify-center" style="min-height:44px; min-width:44px">←</a>
      <span class="text-sm font-semibold text-gray-800 flex-1">📅 Lịch công tác</span>
      <span id="header-user" class="text-xs text-gray-600 hidden sm:inline-block max-w-[150px] truncate"></span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-3 py-4 pb-24">

    <!-- Filter + Add bar -->
    <div class="bg-white rounded-lg shadow-sm p-3 mb-3">
      <div class="grid grid-cols-2 sm:grid-cols-4 gap-2 mb-2">
        <select id="filter-ktv" class="px-2 py-1 border rounded text-sm" style="min-height:44px">
          <option value="">👤 Tất cả KTV</option>
        </select>
        <select id="filter-status" class="px-2 py-1 border rounded text-sm" style="min-height:44px">
          <option value="">📦 Mọi trạng thái</option>
          <option value="pending">⏳ Chờ làm</option>
          <option value="done">✅ Đã xong</option>
          <option value="skipped">⏭️ Bỏ qua</option>
        </select>
        <input id="filter-from" type="date" class="px-2 py-1 border rounded text-sm" style="min-height:44px">
        <input id="filter-to" type="date" class="px-2 py-1 border rounded text-sm" style="min-height:44px">
      </div>
      <div class="flex flex-wrap gap-1 mb-2">
        <button data-preset="today" class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded">Hôm nay</button>
        <button data-preset="week" class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded">Tuần này</button>
        <button data-preset="next-week" class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded">Tuần sau</button>
        <button data-preset="month" class="text-xs px-2 py-1 bg-gray-100 hover:bg-gray-200 rounded">Tháng này</button>
      </div>
      <div class="flex gap-2">
        <button id="btn-load" class="bg-blue-700 text-white px-4 py-2 rounded-lg font-medium" style="min-height:44px">Tìm</button>
        <button id="btn-add" class="hidden bg-green-600 text-white px-4 py-2 rounded-lg font-medium" style="min-height:44px">+ Thêm lịch</button>
        <span id="count" class="self-center text-sm text-gray-600"></span>
      </div>
    </div>

    <div id="loading" class="hidden text-center py-8 text-gray-500">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-300 border-t-blue-700 rounded-full"></div>
      <p class="mt-2 text-sm">Đang tải...</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm overflow-x-auto">
      <table class="w-full text-sm min-w-[800px]">
        <thead class="bg-gray-100 border-b">
          <tr>
            <th class="px-2 py-2 text-center text-xs font-semibold">Ngày</th>
            <th class="px-2 py-2 text-left text-xs font-semibold">KTV</th>
            <th class="px-2 py-2 text-left text-xs font-semibold">Loại KS</th>
            <th class="px-2 py-2 text-left text-xs font-semibold">Khu vực</th>
            <th class="px-2 py-2 text-left text-xs font-semibold">Ghi chú</th>
            <th class="px-2 py-2 text-center text-xs font-semibold">Trạng thái</th>
            <th class="px-2 py-2 text-right text-xs font-semibold">Thao tác</th>
          </tr>
        </thead>
        <tbody id="result-tbody"></tbody>
      </table>
    </div>

    <p id="empty-state" class="hidden text-center text-gray-500 py-8 text-sm">📭 Không có lịch công tác nào trong khoảng đã chọn.</p>
  </main>

  <!-- Dialog Add -->
  <div id="add-dialog" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-2">
    <div class="bg-white rounded-t-xl sm:rounded-xl shadow-xl w-full max-w-md flex flex-col">
      <div class="flex items-center justify-between p-3 border-b">
        <span class="font-semibold text-gray-800">+ Thêm lịch công tác</span>
        <button id="dialog-close" class="text-2xl w-10 h-10 hover:bg-gray-100 rounded">✕</button>
      </div>
      <form id="add-form" class="p-3 space-y-3" novalidate>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">KTV <span class="text-red-600">*</span></label>
          <select id="f-ktv" class="w-full px-3 py-2 border border-gray-300 rounded-lg" style="min-height:44px"></select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ngày <span class="text-red-600">*</span></label>
          <input id="f-ngay" type="date" class="w-full px-3 py-2 border border-gray-300 rounded-lg" style="min-height:44px">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Loại khảo sát</label>
          <select id="f-loaiks" class="w-full px-3 py-2 border border-gray-300 rounded-lg" style="min-height:44px">
            <option value="">(không cụ thể)</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Khu vực</label>
          <input id="f-khuvuc" type="text" class="w-full px-3 py-2 border border-gray-300 rounded-lg" style="min-height:44px" placeholder="vd: Quận 5, Phường An Đông">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Ghi chú</label>
          <textarea id="f-ghichu" rows="2" class="w-full px-3 py-2 border border-gray-300 rounded-lg"></textarea>
        </div>
        <div id="form-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2"></div>
        <button id="btn-save" type="submit" class="w-full bg-blue-700 text-white py-3 rounded-lg font-medium disabled:bg-gray-400" style="min-height:44px">Lưu</button>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth, hasPermission } from './js/auth.js';
    import { initSchedule } from './js/schedule.js';

    const user = requireAuth();
    if (user.role === 'demo') {
      document.querySelector('main').innerHTML = '<div class="bg-yellow-100 border-l-4 border-yellow-500 text-yellow-800 p-4 rounded">⚠️ Tài khoản demo không xem lịch.</div>';
    } else {
      document.getElementById('header-user').textContent = user.full_name;
      if (hasPermission('schedule_write')) {
        document.getElementById('btn-add').classList.remove('hidden');
      }

      document.getElementById('dialog-close').onclick = () => document.getElementById('add-dialog').classList.add('hidden');
      document.getElementById('add-dialog').onclick = (e) => {
        if (e.target.id === 'add-dialog') document.getElementById('add-dialog').classList.add('hidden');
      };

      initSchedule(user);
    }

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
