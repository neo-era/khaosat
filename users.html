<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1d4ed8">
  <link rel="manifest" href="manifest.json">
  <title>Quản lý user — SAPULICO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen">

  <header class="sticky top-0 bg-white shadow-sm z-40">
    <div class="max-w-5xl mx-auto px-2 py-1 flex items-center gap-2">
      <a href="index.html" class="text-xl px-2 rounded hover:bg-gray-100 flex items-center justify-center" style="min-height:44px; min-width:44px">←</a>
      <span class="text-sm font-semibold text-gray-800 flex-1">👥 Quản lý user</span>
      <span id="header-user" class="text-xs text-gray-600 hidden sm:inline-block max-w-[150px] truncate"></span>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-3 py-4 pb-24">

    <div class="flex items-center justify-between mb-3">
      <p class="text-sm text-gray-600">
        <span id="user-count">0</span> user (gồm cả disabled)
      </p>
      <button id="btn-add" class="bg-blue-700 text-white px-4 py-2 rounded-lg font-medium" style="min-height:44px">+ Thêm user</button>
    </div>

    <div id="loading" class="hidden text-center py-8 text-gray-500">
      <div class="animate-spin inline-block w-8 h-8 border-4 border-blue-300 border-t-blue-700 rounded-full"></div>
      <p class="mt-2 text-sm">Đang tải...</p>
    </div>

    <div class="bg-white rounded-lg shadow-sm overflow-x-auto">
      <table class="w-full text-sm min-w-[700px]">
        <thead class="bg-gray-100 border-b">
          <tr>
            <th class="px-2 py-2 text-left text-xs font-semibold">Username</th>
            <th class="px-2 py-2 text-left text-xs font-semibold">Họ tên</th>
            <th class="px-2 py-2 text-center text-xs font-semibold">Vai trò</th>
            <th class="px-2 py-2 text-center text-xs font-semibold">Trạng thái</th>
            <th class="px-2 py-2 text-left text-xs font-semibold">Tạo lúc</th>
            <th class="px-2 py-2 text-right text-xs font-semibold">Thao tác</th>
          </tr>
        </thead>
        <tbody id="user-tbody"></tbody>
      </table>
    </div>

    <p class="text-xs text-gray-500 mt-3">
      💡 Khi vô hiệu hoá: user không login được nhưng dữ liệu lịch sử KPI vẫn giữ. Không thể xoá cứng user qua UI (an toàn).
    </p>
  </main>

  <!-- Dialog Add/Edit -->
  <div id="user-dialog" class="hidden fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-2">
    <div class="bg-white rounded-t-xl sm:rounded-xl shadow-xl w-full max-w-md flex flex-col">
      <div class="flex items-center justify-between p-3 border-b">
        <span id="dialog-title" class="font-semibold text-gray-800"></span>
        <button id="dialog-close" class="text-2xl w-10 h-10 hover:bg-gray-100 rounded">✕</button>
      </div>
      <form id="user-form" class="p-3 space-y-3" novalidate>
        <div id="field-username-wrap">
          <label class="block text-sm font-medium text-gray-700 mb-1">Username <span class="text-red-600">*</span></label>
          <input id="f-username" type="text" autocapitalize="off" autocorrect="off" spellcheck="false"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" style="min-height:44px"
            placeholder="vd: ndtam (chữ thường, không dấu, không khoảng trắng)">
        </div>
        <div id="field-password-wrap">
          <label class="block text-sm font-medium text-gray-700 mb-1">Mật khẩu <span class="text-red-600">*</span></label>
          <input id="f-password" type="text"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" style="min-height:44px"
            placeholder="≥ 8 ký tự, không trùng username">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Họ tên <span class="text-red-600">*</span></label>
          <input id="f-fullname" type="text"
            class="w-full px-3 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" style="min-height:44px"
            placeholder="vd: Nguyễn Đại Tâm">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Vai trò <span class="text-red-600">*</span></label>
          <select id="f-role" class="w-full px-3 py-2 border border-gray-300 rounded-lg" style="min-height:44px">
            <option value="user1">user1 — KTV hiện trường</option>
            <option value="user">user — Quản lý phụ (cùng quyền admin)</option>
            <option value="admin">admin — Quản lý toàn quyền</option>
            <option value="demo">demo — Xem thử</option>
          </select>
        </div>
        <div class="flex items-center">
          <input id="f-active" type="checkbox" checked class="w-5 h-5 mr-2 rounded">
          <label for="f-active" class="text-sm">Tài khoản hoạt động</label>
        </div>
        <div id="form-error" class="hidden text-sm text-red-700 bg-red-50 border border-red-200 rounded p-2"></div>
        <button id="btn-save" type="submit"
          class="w-full bg-blue-700 text-white py-3 rounded-lg font-medium disabled:bg-gray-400" style="min-height:44px">
          Lưu
        </button>
      </form>
    </div>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { initUsers } from './js/users.js';
    import { initHelp } from './js/help.js';

    const user = requireAuth('users_manage');
    document.getElementById('header-user').textContent = user.full_name;

    document.getElementById('dialog-close').onclick = () => document.getElementById('user-dialog').classList.add('hidden');
    document.getElementById('user-dialog').onclick = (e) => {
      if (e.target.id === 'user-dialog') document.getElementById('user-dialog').classList.add('hidden');
    };

    initUsers(user);
    initHelp('admin');

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
